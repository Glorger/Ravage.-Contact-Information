<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support - Ravage</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .developers {
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 1.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            padding: 0.8rem 1.8rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .email-text {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ravage Support</h1>
        <p class="subtitle">Have questions, feedback, or need help with the game? Reach out to us below.</p>
        
        <a href="mailto:wu.shubitidze@gmail.com" class="btn">Email Support</a>
        <span class="email-text">wu.shubitidze@gmail.com</span>

        <div class="developers">
            Co-developed by George F Shubitdze & Wolfgang Wu
        </div>
    </div>

</body>
</html>
